<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b5bd6" />
  <title>AI To-Do Assistant</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1ff;
      --card: #ffffff;
      --primary: #5b5bd6;
      --primary-dark: #4545b8;
      --text: #172033;
      --muted: #687086;
      --border: #dfe3f3;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #dfe6ff 0, transparent 35%),
        linear-gradient(135deg, #f6f8ff, var(--bg));
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #5b5bd6, #8558df);
      color: white;
      font-size: 20px;
      box-shadow: 0 8px 24px rgba(91, 91, 214, 0.28);
      flex: 0 0 auto;
    }

    .brand-text { min-width: 0; }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
    }

    .open-button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .open-button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .app-shell {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: calc(100vh - 69px);
      padding: 14px;
    }

    .frame-card {
      width: 100%;
      height: calc(100vh - 97px);
      min-height: 640px;
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      background: var(--card);
      box-shadow: 0 18px 50px rgba(39, 47, 94, 0.13);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .loading {
      position: absolute;
      inset: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f8f9ff, #eef1ff);
      border-radius: 18px;
      z-index: 2;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      width: min(360px, calc(100% - 36px));
      padding: 28px;
      text-align: center;
      border-radius: 18px;
      background: white;
      border: 1px solid var(--border);
      box-shadow: 0 18px 45px rgba(39, 47, 94, 0.12);
    }

    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 4px solid #e4e7f8;
      border-top-color: var(--primary);
      animation: spin 0.85s linear infinite;
    }

    .loader-title {
      font-weight: 800;
      font-size: 18px;
    }

    .loader-text {
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 640px) {
      .topbar { padding: 10px 12px; }
      .brand-subtitle { display: none; }
      .open-button { padding: 9px 11px; font-size: 13px; }
      .app-shell { padding: 0; }
      .frame-card {
        height: calc(100vh - 61px);
        min-height: 560px;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
      }
      .loading { inset: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">✓</div>
      <div class="brand-text">
        <div class="brand-title">AI To-Do Assistant</div>
        <div class="brand-subtitle">Tasks, Google Calendar and mobile reminders</div>
      </div>
    </div>

    <a
      class="open-button"
      href="https://script.google.com/macros/s/AKfycbzAdBR9_D86-02pFW7igbvbnfzdwjd7ineFeXwku06uvYPd9ZmNxJGPVS5RzcIKpcQY/exec"
      target="_blank"
      rel="noopener noreferrer"
    >
      Open Directly
    </a>
  </header>

  <main class="app-shell">
    <div id="loading" class="loading">
      <div class="loader-card">
        <div class="spinner"></div>
        <div class="loader-title">Opening your assistant…</div>
        <div class="loader-text">
          Please wait while the Google Apps Script application loads.
        </div>
      </div>
    </div>

    <div class="frame-card">
      <iframe
        id="todoFrame"
        src="https://script.google.com/macros/s/AKfycbzAdBR9_D86-02pFW7igbvbnfzdwjd7ineFeXwku06uvYPd9ZmNxJGPVS5RzcIKpcQY/exec"
        title="AI To-Do Assistant"
        allow="clipboard-write"
      ></iframe>
    </div>
  </main>

  <script>
    const frame = document.getElementById("todoFrame");
    const loading = document.getElementById("loading");

    frame.addEventListener("load", () => {
      setTimeout(() => loading.classList.add("hidden"), 350);
    });

    setTimeout(() => {
      loading.classList.add("hidden");
    }, 8000);
  </script>
</body>
</html>
